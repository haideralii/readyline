# Supabase CLI configuration for the LOCAL stack only (CI and developer machines
# with Docker). The hosted project (ref dpwwzhylcyosnkmlcnnp, ap-southeast-2) is
# configured in the dashboard; migrations are pushed to it with `supabase db push`.
project_id = "readyline"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = false

[inbucket]
# Local mail inbox used by the e2e sign-in test to read the magic link.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
