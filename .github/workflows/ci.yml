name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required by src/lib/env.ts; the production value lives in Vercel.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Production dependencies have no high or critical advisories (REQ-002 AC-1)
        run: npm audit --omit=dev --audit-level=high

      - name: No .env file is committed (REQ-002)
        run: node scripts/ci/check-env-files.mjs

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - name: Standards data matches its Commission source snapshots
        run: npm run standards:verify

      - run: npm test

      - run: npm run build
      - name: Supabase secret key is absent from the client bundle (REQ-004 AC-8)
        run: node scripts/ci/check-client-bundle.mjs

      - name: Install Playwright (Chromium and WebKit, REQ-015 FR-16a)
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests (desktop, small Android viewport, iPhone WebKit)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Batch 45a (D-1013): the Lighthouse budget runs in its own job and does
  # not block a merge until it has gone green on the runner; the step prints
  # Lighthouse's own error when it fails. Flip `continue-on-error` back to
  # false by 21 October 2026 (one week), or sooner once a run is green.
  performance-budget:
    name: Performance budgets, mobile profile, public pages (REQ-010, D-1012; advisory until green, D-1013)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright Chromium (the Chrome Lighthouse drives)
        run: npx playwright install --with-deps chromium

      - name: Lighthouse, four public pages, median of three
        run: npm run perf:budget
        env:
          LIGHTHOUSE_BUDGET: "1"
          LIGHTHOUSE_RUNS: "3"
          LIGHTHOUSE_PAGES: "/,/pricing,/start,/start/business"

      - name: Upload the Lighthouse budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-budget
          path: out/lighthouse-budget.txt
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks, REQ-002 AC-2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          # PR comments need write permission we do not grant (D-205).
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Config: .gitleaks.toml (default rules; allow-list scoped to data/sources/ only).

  supabase-integration:
    name: Supabase local stack, migrations and RLS tests (REQ-004 SR-1, SR-6)
    runs-on: ubuntu-latest
    # Batch 45b item 2: the signed-in suites now run the guided path to the end on three projects; run 595 was cut at 20 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (D-038): 'latest' asks the GitHub API anonymously and shared runners hit the rate limit.
          version: 2.120.0
          github-token: ${{ github.token }}

      - name: Start the local stack and apply supabase/migrations
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Export local stack settings under the app's variable names
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"

      - name: Row-level security and tenancy tests
        run: npm run test:integration

      - name: Build for the signed-in end-to-end run
        run: npm run build

      - name: Install Playwright (Chromium and WebKit, REQ-015 FR-16a)
        run: npx playwright install --with-deps chromium webkit

      - name: Performance budget on the documents page, signed in (REQ-010, backlog 2, D-1012; advisory until green, D-1013)
        continue-on-error: true
        run: npm run perf:budget
        env:
          LIGHTHOUSE_BUDGET: "1"
          LIGHTHOUSE_RUNS: "3"
          LIGHTHOUSE_PAGES: "/documents"

      - name: Upload the signed-in Lighthouse budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-budget-signed-in
          path: out/lighthouse-budget.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Signed-in end-to-end specs against the local stack (three projects)
        run: npx playwright test e2e/signed-in
        env:
          CI: "true"
          EVIDENCE: "1"

      - name: Upload the signed-in screenshots (REQ evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-in-screenshots
          path: product/evidence/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-signed-in
          path: playwright-report/
          retention-days: 7

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
  docx-render:
    name: Render skeleton .docx sets and convert with LibreOffice (REQ-005 AC-1 mechanics, D-504)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, 'REQ-005') ||
      github.event.pull_request.head.ref == 'req-005-generator'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install LibreOffice Writer (headless)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer

      - name: Render the three reference skeleton sets to out/skeletons
        run: npm run generator:skeletons
        env:
          WRITE_SKELETONS: "1"

      - name: Convert every .docx to PDF with LibreOffice; fail if any file does not convert
        run: |
          set -euo pipefail
          total=0; converted=0
          for dir in out/skeletons/*/; do
            mkdir -p "$dir/pdf"
            for f in "$dir"*.docx; do
              total=$((total+1))
              soffice --headless --convert-to pdf --outdir "$dir/pdf" "$f" > /dev/null
              base="$(basename "${f%.docx}")"
              if [ -s "$dir/pdf/$base.pdf" ]; then converted=$((converted+1)); else echo "::error::$f did not convert"; fi
            done
          done
          echo "converted $converted of $total documents"
          [ "$total" -gt 0 ] && [ "$converted" -eq "$total" ]

      - name: Document standard lint over every rendered set (REQ-016 FR-1); prints the fonts and heading styles found
        run: |
          mkdir -p out
          npx vitest run src/lib/generator/docx-lint.test.ts
          cat out/docx-lint-report.txt
        env:
          DOCX_REPORT: "1"

      - name: Upload the skeleton sets for the PO
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-document-sets
          path: out/skeletons/
          retention-days: 14
