name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required by src/lib/env.ts; the production value lives in Vercel.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Production dependencies have no high or critical advisories (REQ-002 AC-1)
        run: npm audit --omit=dev --audit-level=high

      - name: No .env file is committed (REQ-002)
        run: node scripts/ci/check-env-files.mjs

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - name: Standards data matches its Commission source snapshots
        run: npm run standards:verify

      - run: npm test

      - run: npm run build

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop + small Android viewport)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks, REQ-002 AC-2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Config: .gitleaks.toml (default rules; allow-list scoped to data/sources/ only).
