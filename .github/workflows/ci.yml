name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    # D-2206: a docs-only commit on main (product/, markdown) runs nothing here;
    # every pull request still runs the whole workflow whatever it touches.
    paths-ignore:
      - "product/**"
      - "**/*.md"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required by src/lib/env.ts; the production value lives in Vercel.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    # D-2983: run 39144287228 was cut at 20 minutes, 16 minutes into the end-to-end tests with no test red (#125, 19 Oct 2026); the suites outgrew the budget. D-2984 brings the wall time back by sharding (Dev-1).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: The lockfile is what npm ci installed from; the tree is clean (REQ-012 FR-2)
        run: |
          git diff --exit-code -- package-lock.json
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "FAIL npm ci changed the tree" >&2; exit 1; }

      - name: Production dependencies have no high or critical advisories (REQ-002 AC-1)
        run: npm audit --omit=dev --audit-level=high

      - name: No .env file is committed (REQ-002)
        run: node scripts/ci/check-env-files.mjs

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - name: Standards data matches its Commission source snapshots
        run: npm run standards:verify

      - run: npm test

      - name: Generator exam over the three reference cases, replayed and skeleton, as a report (backlog 9; PO 18 Oct 2026)
        run: npx vitest run src/lib/generator/exam.test.ts
        env:
          EXAM_ARTEFACT: "1"

      - name: Upload the generator exam report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generator-exam
          path: out/generator-exam/
          retention-days: 30
          if-no-files-found: ignore

      - name: Document standard lint over the full 16-document sole-trader pack, replayed from the fixtures (REQ-016 FR-1; backlog 4)
        run: |
          mkdir -p out
          npx vitest run src/lib/generator/docx-lint.test.ts
          cat out/docx-lint-report.txt
        env:
          DOCX_REPORT: "1"

      - name: Upload the docx lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docx-lint-report
          path: out/docx-lint-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - run: npm run build
      - name: Supabase secret key is absent from the client bundle (REQ-004 AC-8)
        run: node scripts/ci/check-client-bundle.mjs

      # REQ-012 FR-1d (AC-2): the production build on its own port, every route class
      # compared with the expected-values table in scripts/ops/check-headers-lib.mjs
      # (HSTS, nosniff, referrer, permissions, frame options, no X-Powered-By, the nonce
      # CSP with Checkout on the purchase page alone). Same fixture values the Playwright
      # web server uses; the server is stopped when the check has run.
      - name: Security headers on every route class (REQ-012 FR-1d, AC-2)
        env:
          PORT: "3200"
          STRIPE_FAKE: "1"
          PACK_PRICE_AUD_CENTS: "39900"
          SUBSCRIPTION_PRICE_AUD_CENTS: "3900"
          HASH_PEPPER: e2e-hash-pepper-0123456789abcdef # gitleaks:allow
          CRON_SECRET: e2e-cron-secret-0123456789abcdef # gitleaks:allow
        run: |
          npm run start > /tmp/headers-server.log 2>&1 &
          node scripts/ops/check-headers.mjs --base http://localhost:3200 --wait 90 --json out/headers.json
          kill %1

      - name: Install Playwright (Chromium and WebKit, REQ-015 FR-16a)
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests (desktop, small Android viewport, iPhone WebKit)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: The public pages with the subscription off (batch 47 item 1; no Stripe at all)
        run: npx playwright test e2e/subscription-off.spec.ts --project=desktop-chromium
        env:
          CI: "true"
          STRIPE_FAKE: "0"

      # REQ-022 FR-13 (AC-7, D-2289): the same name and ABN on every surface, three projects. The
      # full run above has the two unset and asserts no placeholder; this step sets fixture values.
      # 51 824 753 556 is the ATO's published example ABN, no business's.
      - name: The registered name and ABN on every surface (REQ-022 FR-13, AC-7; fixture values)
        run: npx playwright test e2e/business-identity.spec.ts
        env:
          CI: "true"
          BUSINESS_NAME: "Fixture Supports"
          BUSINESS_ABN: "51824753556"

      # REQ-022 FR-11 (AC-6): the lawyer's bundle index builds from the committed files alone and
      # refuses to write itself with a fixture address or an unfilled token in it.
      - name: The lawyer's bundle index builds with no fixture address (REQ-022 FR-11, AC-6)
        run: node scripts/ops/legal-bundle.mjs --out "$RUNNER_TEMP/legal-bundle"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Batch 45a (D-1013) let this job fail without blocking until it had gone green on
  # the runner; REQ-012 FR-5 (D-2901, D-2348) made it blocking on 19 October
  # 2026 after four green runs on next. The step prints Lighthouse's own
  # error when it fails; one retry covers a single run's noise.
  performance-budget:
    name: Performance budgets, mobile profile, public content and questionnaire pages (REQ-010, D-1012; blocking, REQ-012 FR-5)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright Chromium (the Chrome Lighthouse drives)
        run: npx playwright install --with-deps chromium

      # REQ-012 FR-5: the public-content and questionnaire classes, the
      # median of five runs, and one retry so a single run's noise does not
      # fail the job on its own; the report carries the budgets per class.
      - name: Lighthouse, public content and questionnaire pages, median of five
        run: npm run perf:budget || npm run perf:budget
        env:
          LIGHTHOUSE_BUDGET: "1"
          LIGHTHOUSE_RUNS: "5"
          LIGHTHOUSE_PAGES: "/,/pricing,/guides/which-ndis-audit,/start,/start/business"

      - name: Upload the Lighthouse budget report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-budget
          path: out/lighthouse-budget.txt
          if-no-files-found: ignore
          retention-days: 14

  # The secret scan moved to .github/workflows/secrets.yml, which runs on
  # every push to every branch (backlog 5, D-209).

  supabase-integration:
    name: Supabase local stack, migrations and RLS tests (REQ-004 SR-1, SR-6)
    runs-on: ubuntu-latest
    # Batch 45b item 2: the signed-in suites now run the guided path to the end on three projects; run 595 was cut at 20 minutes.
    # D-2983: run 39144287228 was cut at 40 minutes in the signed-in step with no test red (#125, 19 Oct 2026); the suites outgrew the budget. D-2984 brings the wall time back by sharding (Dev-1).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Pinned (D-038): a fixed CLI version, so every run installs the same binary; v3 installs from npm (REQ-012 FR-2).
          version: 2.120.0

      - name: Start the local stack and apply supabase/migrations
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Export local stack settings under the app's variable names
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          # REQ-022 Session A (D-2210): the admin e2e raises its throwaway admin through SQL, as an operator would.
          echo "SUPABASE_DB_URL=${DB_URL}" >> "$GITHUB_ENV"

      - name: Row-level security and tenancy tests
        run: npm run test:integration

      # REQ-030 FR-2, AC-3 (D-2866): the restore rehearsal. The seeded stack is dumped and
      # encrypted under a fixture passphrase (the production one never enters CI, SR-5), the
      # plaintext never touching disk (SR-2); the stack is reset to a fresh one with the
      # migrations applied, the copy is restored into it, and the integration suite runs again
      # on the restored stack. The size and the seconds are in the log (the evidence).
      # The runner image ships the PostgreSQL 16 client and the stack is major 17
      # (supabase/config.toml); pg_dump refuses a server newer than itself, so the
      # rehearsal needs the 17 client, installed as backup.yml installs it.
      - name: PostgreSQL 17 client (the stack's major; the dump must not be older)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # The runner's /usr/bin/pg_dump is postgresql-common's wrapper, which picks the
          # runner's own 16 cluster even with the 17 client installed (#115 at 7f37b36);
          # the 17 binaries go first on PATH for every later step.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      # One step per command, so the jobs API (public) names the one that fails and
      # the first step proves the database URL reaches the stack before any dump.
      - name: Backup and restore rehearsal (REQ-030 FR-2, AC-3), the connection
        env:
          BACKUP_PASSPHRASE: rehearsal-fixture-passphrase-0123456789 # gitleaks:allow
          DB_URL: ${{ env.SUPABASE_DB_URL }}
          OUT: /tmp/rehearsal.sql.gpg
          IN: /tmp/rehearsal.sql.gpg
          SKIP_AUDIT: "1"
        run: |
          test -n "$DB_URL" || { echo "FAIL SUPABASE_DB_URL is empty: supabase status -o env did not give DB_URL" >&2; exit 1; }
          psql "$DB_URL" -Atc "select version()"
          # The counts the restore must give back (PO, 18 Oct 18:50): auth.users and public.accounts.
          before=$(psql "$DB_URL" -Atc "select (select count(*) from auth.users) || ' users, ' || (select count(*) from public.accounts) || ' accounts'")
          echo "rows before the dump: $before"
          echo "ROWS_BEFORE=$before" >> "$GITHUB_ENV"

      - name: Backup and restore rehearsal, the dump (scripts/ops/backup.sh)
        env:
          BACKUP_PASSPHRASE: rehearsal-fixture-passphrase-0123456789 # gitleaks:allow
          DB_URL: ${{ env.SUPABASE_DB_URL }}
          OUT: /tmp/rehearsal.sql.gpg
          IN: /tmp/rehearsal.sql.gpg
          SKIP_AUDIT: "1"
        run: scripts/ops/backup.sh

      - name: Backup and restore rehearsal, a fresh stack (migrations applied, no seed)
        run: supabase db reset --local --no-seed

      - name: Backup and restore rehearsal, the restore (scripts/ops/restore-rehearsal.sh)
        env:
          BACKUP_PASSPHRASE: rehearsal-fixture-passphrase-0123456789 # gitleaks:allow
          DB_URL: ${{ env.SUPABASE_DB_URL }}
          OUT: /tmp/rehearsal.sql.gpg
          IN: /tmp/rehearsal.sql.gpg
          SKIP_AUDIT: "1"
        run: scripts/ops/restore-rehearsal.sh

      - name: Backup and restore rehearsal, the counts after the restore match the counts before
        env:
          DB_URL: ${{ env.SUPABASE_DB_URL }}
        run: |
          after=$(psql "$DB_URL" -Atc "select (select count(*) from auth.users) || ' users, ' || (select count(*) from public.accounts) || ' accounts'")
          echo "rows after the restore: $after (before the dump: $ROWS_BEFORE)"
          test "$after" = "$ROWS_BEFORE" || { echo "FAIL the restored stack does not hold what was dumped" >&2; exit 1; }

      - name: Backup and restore rehearsal, the integration suite on the restored stack
        run: npm run test:integration

      - name: Build for the signed-in end-to-end run
        run: npm run build

      - name: Install Playwright (Chromium and WebKit, REQ-015 FR-16a)
        run: npx playwright install --with-deps chromium webkit

      - name: Performance budgets on the signed-in pages (REQ-010, backlog 2, D-1012; blocking, REQ-012 FR-5)
        run: npm run perf:budget || npm run perf:budget
        env:
          LIGHTHOUSE_BUDGET: "1"
          LIGHTHOUSE_RUNS: "5"
          LIGHTHOUSE_PAGES: "/documents,/registers,/worker"

      - name: Upload the signed-in Lighthouse budget report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-budget-signed-in
          path: out/lighthouse-budget.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Signed-in end-to-end specs against the local stack (three projects)
        run: npx playwright test e2e/signed-in
        env:
          CI: "true"
          EVIDENCE: "1"
          # Batch 45 item 2 (PO, 15 Oct 2026): the Buy box is hidden while generation is off,
          # so the purchase flow needs it on; the set replays recorded fixtures, no live model.
          GENERATION_ENABLED: "true"

      - name: The documents page with generation off (batch 45 item 2; the variable unset)
        run: npx playwright test e2e/signed-in/generation-off.spec.ts
        env:
          CI: "true"

      - name: Upload the signed-in screenshots (REQ evidence)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-in-screenshots
          path: product/evidence/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-signed-in
          path: playwright-report/
          retention-days: 7

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
  docx-render:
    name: Render skeleton .docx sets and convert with LibreOffice (REQ-005 AC-1 mechanics, D-504)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, 'REQ-005') ||
      github.event.pull_request.head.ref == 'req-005-generator'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install LibreOffice Writer (headless)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer

      - name: Render the three reference skeleton sets to out/skeletons
        run: npm run generator:skeletons
        env:
          WRITE_SKELETONS: "1"

      - name: Convert every .docx to PDF with LibreOffice; fail if any file does not convert
        run: |
          set -euo pipefail
          total=0; converted=0
          for dir in out/skeletons/*/; do
            mkdir -p "$dir/pdf"
            for f in "$dir"*.docx; do
              total=$((total+1))
              soffice --headless --convert-to pdf --outdir "$dir/pdf" "$f" > /dev/null
              base="$(basename "${f%.docx}")"
              if [ -s "$dir/pdf/$base.pdf" ]; then converted=$((converted+1)); else echo "::error::$f did not convert"; fi
            done
          done
          echo "converted $converted of $total documents"
          [ "$total" -gt 0 ] && [ "$converted" -eq "$total" ]

      - name: Document standard lint over every rendered set (REQ-016 FR-1); prints the fonts and heading styles found
        run: |
          mkdir -p out
          npx vitest run src/lib/generator/docx-lint.test.ts
          cat out/docx-lint-report.txt
        env:
          DOCX_REPORT: "1"

      - name: Upload the skeleton sets for the PO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skeleton-document-sets
          path: out/skeletons/
          retention-days: 14
