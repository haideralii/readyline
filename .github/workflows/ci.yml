name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    # D-2206: a docs-only commit on main (product/, markdown) runs nothing here;
    # every pull request still runs the whole workflow whatever it touches.
    paths-ignore:
      - "product/**"
      - "**/*.md"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required by src/lib/env.ts; the production value lives in Vercel.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Production dependencies have no high or critical advisories (REQ-002 AC-1)
        run: npm audit --omit=dev --audit-level=high

      - name: No .env file is committed (REQ-002)
        run: node scripts/ci/check-env-files.mjs

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - name: Standards data matches its Commission source snapshots
        run: npm run standards:verify

      - run: npm test

      - name: Generator exam over the three reference cases, replayed and skeleton, as a report (backlog 9; PO 18 Oct 2026)
        run: npx vitest run src/lib/generator/exam.test.ts
        env:
          EXAM_ARTEFACT: "1"

      - name: Upload the generator exam report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-exam
          path: out/generator-exam/
          retention-days: 30
          if-no-files-found: ignore

      - name: Document standard lint over the full 16-document sole-trader pack, replayed from the fixtures (REQ-016 FR-1; backlog 4)
        run: |
          mkdir -p out
          npx vitest run src/lib/generator/docx-lint.test.ts
          cat out/docx-lint-report.txt
        env:
          DOCX_REPORT: "1"

      - name: Upload the docx lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-lint-report
          path: out/docx-lint-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - run: npm run build
      - name: Supabase secret key is absent from the client bundle (REQ-004 AC-8)
        run: node scripts/ci/check-client-bundle.mjs

      - name: Install Playwright (Chromium and WebKit, REQ-015 FR-16a)
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests (desktop, small Android viewport, iPhone WebKit)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: The public pages with the subscription off (batch 47 item 1; no Stripe at all)
        run: npx playwright test e2e/subscription-off.spec.ts --project=desktop-chromium
        env:
          CI: "true"
          STRIPE_FAKE: "0"

      # REQ-022 FR-13 (AC-7, D-2289): the same name and ABN on every surface, three projects. The
      # full run above has the two unset and asserts no placeholder; this step sets fixture values.
      # 51 824 753 556 is the ATO's published example ABN, no business's.
      - name: The registered name and ABN on every surface (REQ-022 FR-13, AC-7; fixture values)
        run: npx playwright test e2e/business-identity.spec.ts
        env:
          CI: "true"
          BUSINESS_NAME: "Fixture Supports"
          BUSINESS_ABN: "51824753556"

      # REQ-022 FR-11 (AC-6): the lawyer's bundle index builds from the committed files alone and
      # refuses to write itself with a fixture address or an unfilled token in it.
      - name: The lawyer's bundle index builds with no fixture address (REQ-022 FR-11, AC-6)
        run: node scripts/ops/legal-bundle.mjs --out "$RUNNER_TEMP/legal-bundle"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Batch 45a (D-1013): the Lighthouse budget runs in its own job and does
  # not block a merge until it has gone green on the runner; the step prints
  # Lighthouse's own error when it fails. Flip `continue-on-error` back to
  # false by 21 October 2026 (one week), or sooner once a run is green.
  performance-budget:
    name: Performance budgets, mobile profile, public pages (REQ-010, D-1012; advisory until green, D-1013)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright Chromium (the Chrome Lighthouse drives)
        run: npx playwright install --with-deps chromium

      - name: Lighthouse, four public pages, median of three
        run: npm run perf:budget
        env:
          LIGHTHOUSE_BUDGET: "1"
          LIGHTHOUSE_RUNS: "3"
          LIGHTHOUSE_PAGES: "/,/pricing,/start,/start/business"

      - name: Upload the Lighthouse budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-budget
          path: out/lighthouse-budget.txt
          if-no-files-found: ignore
          retention-days: 14

  # The secret scan moved to .github/workflows/secrets.yml, which runs on
  # every push to every branch (backlog 5, D-209).

  supabase-integration:
    name: Supabase local stack, migrations and RLS tests (REQ-004 SR-1, SR-6)
    runs-on: ubuntu-latest
    # Batch 45b item 2: the signed-in suites now run the guided path to the end on three projects; run 595 was cut at 20 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (D-038): 'latest' asks the GitHub API anonymously and shared runners hit the rate limit.
          version: 2.120.0
          github-token: ${{ github.token }}

      - name: Start the local stack and apply supabase/migrations
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Export local stack settings under the app's variable names
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          # REQ-022 Session A (D-2210): the admin e2e raises its throwaway admin through SQL, as an operator would.
          echo "SUPABASE_DB_URL=${DB_URL}" >> "$GITHUB_ENV"

      - name: Row-level security and tenancy tests
        run: npm run test:integration

      # REQ-030 FR-2, AC-3 (D-2866): the restore rehearsal. The seeded stack is dumped and
      # encrypted under a fixture passphrase (the production one never enters CI, SR-5), the
      # plaintext never touching disk (SR-2); the stack is reset to a fresh one with the
      # migrations applied, the copy is restored into it, and the integration suite runs again
      # on the restored stack. The size and the seconds are in the log (the evidence).
      # The runner image ships the PostgreSQL 16 client and the stack is major 17
      # (supabase/config.toml); pg_dump refuses a server newer than itself, so the
      # rehearsal needs the 17 client, installed as backup.yml installs it.
      - name: PostgreSQL 17 client (the stack's major; the dump must not be older)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version
          pg_restore --version

      - name: Backup and restore rehearsal (REQ-030 FR-2, AC-3)
        env:
          BACKUP_PASSPHRASE: rehearsal-fixture-passphrase-0123456789 # gitleaks:allow
          DB_URL: ${{ env.SUPABASE_DB_URL }}
          OUT: /tmp/rehearsal.sql.gpg
          IN: /tmp/rehearsal.sql.gpg
          SKIP_AUDIT: "1"
        run: |
          scripts/ops/backup.sh
          supabase db reset --local --no-seed
          scripts/ops/restore-rehearsal.sh
          npm run test:integration

      - name: Build for the signed-in end-to-end run
        run: npm run build

      - name: Install Playwright (Chromium and WebKit, REQ-015 FR-16a)
        run: npx playwright install --with-deps chromium webkit

      - name: Performance budget on the documents page, signed in (REQ-010, backlog 2, D-1012; advisory until green, D-1013)
        continue-on-error: true
        run: npm run perf:budget
        env:
          LIGHTHOUSE_BUDGET: "1"
          LIGHTHOUSE_RUNS: "3"
          LIGHTHOUSE_PAGES: "/documents"

      - name: Upload the signed-in Lighthouse budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-budget-signed-in
          path: out/lighthouse-budget.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Signed-in end-to-end specs against the local stack (three projects)
        run: npx playwright test e2e/signed-in
        env:
          CI: "true"
          EVIDENCE: "1"
          # Batch 45 item 2 (PO, 15 Oct 2026): the Buy box is hidden while generation is off,
          # so the purchase flow needs it on; the set replays recorded fixtures, no live model.
          GENERATION_ENABLED: "true"

      - name: The documents page with generation off (batch 45 item 2; the variable unset)
        run: npx playwright test e2e/signed-in/generation-off.spec.ts
        env:
          CI: "true"

      - name: Upload the signed-in screenshots (REQ evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-in-screenshots
          path: product/evidence/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-signed-in
          path: playwright-report/
          retention-days: 7

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
  docx-render:
    name: Render skeleton .docx sets and convert with LibreOffice (REQ-005 AC-1 mechanics, D-504)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, 'REQ-005') ||
      github.event.pull_request.head.ref == 'req-005-generator'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install LibreOffice Writer (headless)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer

      - name: Render the three reference skeleton sets to out/skeletons
        run: npm run generator:skeletons
        env:
          WRITE_SKELETONS: "1"

      - name: Convert every .docx to PDF with LibreOffice; fail if any file does not convert
        run: |
          set -euo pipefail
          total=0; converted=0
          for dir in out/skeletons/*/; do
            mkdir -p "$dir/pdf"
            for f in "$dir"*.docx; do
              total=$((total+1))
              soffice --headless --convert-to pdf --outdir "$dir/pdf" "$f" > /dev/null
              base="$(basename "${f%.docx}")"
              if [ -s "$dir/pdf/$base.pdf" ]; then converted=$((converted+1)); else echo "::error::$f did not convert"; fi
            done
          done
          echo "converted $converted of $total documents"
          [ "$total" -gt 0 ] && [ "$converted" -eq "$total" ]

      - name: Document standard lint over every rendered set (REQ-016 FR-1); prints the fonts and heading styles found
        run: |
          mkdir -p out
          npx vitest run src/lib/generator/docx-lint.test.ts
          cat out/docx-lint-report.txt
        env:
          DOCX_REPORT: "1"

      - name: Upload the skeleton sets for the PO
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-document-sets
          path: out/skeletons/
          retention-days: 14
