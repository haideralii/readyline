name: Secret scan

# Backlog 5 (REQ-002 AC-2, D-209): gitleaks on every push to every branch
# and on every pull request, in its own workflow so the scan never waits
# for, or is cancelled with, the heavier CI jobs. Config: .gitleaks.toml
# (default rules; allow-list scoped to data/sources/ only).
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks, REQ-002 AC-2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          # PR comments need write permission we do not grant (D-205).
          GITLEAKS_ENABLE_COMMENTS: "false"
