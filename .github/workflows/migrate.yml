name: Migrate hosted database

# REQ-004 / D-032: migrations reach the hosted Supabase project through this
# job, never by hand. It runs on pushes to main that touch supabase/migrations
# and skips cleanly, with a notice, until the repository secrets exist.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: migrate-hosted
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push (project dpwwzhylcyosnkmlcnnp, ap-southeast-2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_REF: dpwwzhylcyosnkmlcnnp
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check that the secrets exist
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice title=Migration skipped::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are not set as repository secrets; the hosted database was not changed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest

      - name: Link to the hosted project
        if: steps.gate.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending migrations
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push --include-all

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        run: supabase migration list
