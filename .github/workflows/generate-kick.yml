name: Kick paid generation

# Batch 32 item 1 (D-1006), schedule and dispatch per D-059 (batch 37): the
# paid document chain on Vercel Hobby only progresses while something calls
# /api/jobs/generate (Hobby cron is daily and `waitUntil` does not carry the
# self-kick reliably, D-057). The app sends a `repository_dispatch` event
# (type `generate`) when work exists: on a paid checkout and on a nudge from
# the documents page that finds a stalled job (src/server/generation/
# dispatch.ts, needs GITHUB_DISPATCH_TOKEN in Vercel). The schedule every
# thirty minutes is the safety net when the token is missing or the
# dispatch failed. Either way the job calls the route with the bearer until
# it answers `"more": false` or twenty minutes have passed. The route
# refuses without the bearer (404) and claims jobs behind a skip-locked
# lease, so a kick that overlaps a live chain is a no-op
# (scripts/ops/kick-generation.test.ts).
#
# Minutes: a scheduled run with nothing to do makes one call and ends, so
# the schedule costs about 1,440 runner minutes a month against GitHub's
# 2,000 free for a private repository; a dispatched run costs only while a
# pack is generating. REQ-030 FR-3 (D-2867): the uptime step rides inside
# the same minute (two fetches, seconds), so the check costs nothing more;
# a separate thirty-minute workflow would have cost another 1,440.
#
# Needs: repository variable PROD_URL (https://<domain>, no trailing slash)
# and repository secret CRON_SECRET (the same value as the Vercel variable;
# Haider pastes it, see supabase/ops/DEPLOY.md section 8a). Until both exist
# the job skips with a notice.
#
# Dry run (act is not installed on the Dev machine): the YAML is parsed and
# its shape asserted by scripts/ci/workflows.test.ts; the loop itself is
# scripts/ops/kick-generation-lib.mjs, unit-tested against a stub route;
# the command is run by hand with `PROD_URL=http://localhost:3000
# CRON_SECRET=<local value> node scripts/ops/kick-generation.mjs` against
# `npm run start`. Note: GitHub pauses scheduled workflows after 60 days
# without a push, and a scheduled run costs at least one runner minute.

on:
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [generate]
  workflow_dispatch:

concurrency:
  group: generate-kick
  cancel-in-progress: false

permissions:
  contents: read
  # REQ-030 FR-3 (D-2867, SR-3): the uptime step opens and closes the "Site down" issue.
  issues: write

jobs:
  kick:
    name: Call /api/jobs/generate until drained
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      KICK_MAX_SECONDS: "1200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ops
          sparse-checkout-cone-mode: false

      # REQ-030 FR-3 (D-2867): the uptime check, ahead of the gate, needing PROD_URL alone. Its
      # two-strike memory is one small file carried between runs by the Actions cache (the probe
      # has no other memory when the site is down); it reports to /api/jobs/uptime when
      # CRON_SECRET is set and opens or closes the "Site down <date>" issue with GITHUB_TOKEN.
      - name: Restore the uptime check's state
        if: env.PROD_URL != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uptime-state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Uptime check on PROD_URL (REQ-030 FR-3)
        if: env.PROD_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ops/uptime.mjs

      - name: Save the uptime check's state
        if: env.PROD_URL != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uptime-state.json
          key: uptime-state-${{ github.run_id }}

      - name: Check that the variable and the secret exist
        id: gate
        run: |
          if [ -z "$PROD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice title=Kick skipped::PROD_URL (repository variable) or CRON_SECRET (repository secret) is not set; nothing was called."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$CRON_SECRET"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Kick the generation route until it reports nothing more to do
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/ops/kick-generation.mjs
